# Configuration Render.com pour VisaCanada
services:
  # Backend FastAPI
  - type: web
    name: visacanada-backend
    runtime: python
    buildCommand: cd backend && pip install -e ".[dev]"
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visacanada-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: visacanada-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: CORS_ORIGINS
        value: https://visacanada-frontend.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_DOC_INTELLIGENCE_ENDPOINT
        sync: false
      - key: AZURE_DOC_INTELLIGENCE_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: visacanada-production

  # Frontend Next.js
  - type: web
    name: visacanada-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://visacanada-backend.onrender.com

  # Celery Worker (background tasks)
  - type: worker
    name: visacanada-worker
    runtime: python
    buildCommand: cd backend && pip install -e ".[dev]"
    startCommand: cd backend && celery -A app.tasks.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visacanada-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: visacanada-redis
          type: redis
          property: connectionString

  # Celery Beat (scheduled tasks)
  - type: worker
    name: visacanada-beat
    runtime: python
    buildCommand: cd backend && pip install -e ".[dev]"
    startCommand: cd backend && celery -A app.tasks.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visacanada-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: visacanada-redis
          type: redis
          property: connectionString

databases:
  # PostgreSQL
  - name: visacanada-db
    plan: free
    databaseName: visacanada
    user: visacanada

  # Redis
  - name: visacanada-redis
    plan: free
