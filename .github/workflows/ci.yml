name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: visacanada_test
          POSTGRES_USER: visacanada
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://visacanada:test_password@localhost:5432/visacanada_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # The npm cache needs the lockfile to exist; setup-node fails outright when
      # cache-dependency-path resolves to nothing (e.g. branches predating the
      # lockfile). Gate the cache on its presence instead.
      - name: Check for lockfile
        id: lockfile
        run: echo "exists=$([ -f package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.lockfile.outputs.exists == 'true' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Reproducible install when the lockfile is present; fall back otherwise.
        run: |
          if [ "${{ steps.lockfile.outputs.exists }}" = "true" ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
